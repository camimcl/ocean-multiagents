[project]
name = "ocean-multiagentes"
version = "0.1.0"
description = "Agentes da equipe para o Ocean 1.1 (Modo por Turnos) - Bootcamp Deloitte"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
